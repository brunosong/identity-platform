# 로컬 개발 프로파일.
spring:
  jpa:
    show-sql: true
  flyway:
    clean-disabled: false

# 게이트웨이가 없어서 프론트엔드가 auth, customer, order 를 각각 직접 부른다.
# 서비스를 하나 붙일 때마다 그 서비스가 자기 CORS 를 또 밝혀야 한다.
app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174

logging:
  level:
    com.brunosong.identityplatform: DEBUG
