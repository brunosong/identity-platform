# order-service 기본 설정.
spring:
  application:
    name: order-service
  datasource:
    # auth 와도, customer 와도 다른 데이터베이스다.
    url: ${DB_URL:jdbc:postgresql://localhost:55434/orders}
    username: ${DB_USERNAME:orders}
    password: ${DB_PASSWORD:orders}
  security:
    oauth2:
      resourceserver:
        jwt:
          # customer-service 와 똑같은 값이다. 두 서비스가 같은 realm 에 있으니 당연한 일이고,
          # 발급자 이름에 realm 이 들어 있어 이 한 줄이 realm 경계가 된다.
          # 어드민 토큰은 이 발급자의 JWKS 에 없는 키로 서명돼 있어 서명 단계에서 죽는다.
          issuer-uri: ${AUTH_ISSUER:http://localhost:8080/realms/portal}

          # 여기가 customer-service 와 갈리는 자리다.
          #
          # 발급자만 확인하면 포털 realm 의 토큰이면 무엇이든 통한다 — customer-service 로 들어온
          # 토큰을 여기에 그대로 재생할 수 있다는 뜻이다. 서비스가 늘수록 가장 약한 서비스 하나가
          # realm 전체의 보안 수준이 된다. 그래서 자기 이름으로 발급된 토큰만 받는다.
          #
          # 통합 로그인은 깨지지 않는다. 고객 포털 클라이언트가 audience 를 둘 가지고 있어
          # (token.clients.customer-portal.audiences = customer-service,order-service)
          # 한 번 로그인한 토큰 하나가 두 서비스 모두에 통한다.
          audiences: ${AUTH_AUDIENCE:order-service}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway(db/migration)가 만든다. 엔티티와 어긋나면 뜨지 않는다.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:8082}

logging:
  level:
    com.brunosong.identityplatform: INFO
