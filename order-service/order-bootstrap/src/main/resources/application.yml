# order-service 기본 설정.
spring:
  application:
    name: order-service
  datasource:
    # auth 와도, customer 와도 다른 데이터베이스다.
    url: ${DB_URL:jdbc:postgresql://localhost:55434/orders}
    username: ${DB_USERNAME:orders}
    password: ${DB_PASSWORD:orders}
  security:
    oauth2:
      resourceserver:
        jwt:
          # customer-service 와 똑같은 값이다. 두 서비스가 같은 realm 에 있으니 당연한 일이고,
          # 발급자 이름에 realm 이 들어 있어 이 한 줄이 realm 경계가 된다.
          # 어드민 토큰은 이 발급자의 JWKS 에 없는 키로 서명돼 있어 서명 단계에서 죽는다.
          issuer-uri: ${AUTH_ISSUER:http://localhost:8080/realms/portal}

          # customer-service 와 똑같은 값이다. 둘 다 shop 시스템에 속하기 때문이고,
          # 그래서 한 토큰이 둘 다에 통한다.
          #
          # 발급자만 확인하면 포털 realm 의 토큰이면 무엇이든 통한다. 다른 시스템으로 들어온
          # 토큰을 여기에 그대로 재생할 수 있다는 뜻이라 시스템까지 대조한다.
          #
          # 값이 order-service 가 아닌 것이 요점이다. 서비스 이름을 적으면 서비스를 붙일 때마다
          # auth 설정을 고쳐야 하고, 이미 발급된 토큰은 새 서비스에 닿지 못한다. 서비스를
          # 가르는 것은 aud 가 아니라 아래 app.service-id 와 resource_access 다.
          audiences: ${AUTH_AUDIENCE:shop}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway(db/migration)가 만든다. 엔티티와 어긋나면 뜨지 않는다.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  # 토큰의 resource_access 에서 읽을 칸 이름. auth 의 authz_service.service_id 와 같아야 한다.
  #
  # 같은 토큰에 customer-service 의 칸도 실려 있다. 이 값이 그중 내 칸을 고른다.
  service-id: ${APP_SERVICE_ID:order-service}

server:
  port: ${SERVER_PORT:8082}

logging:
  level:
    com.brunosong.identityplatform: INFO
