# customer-service 기본 설정.
spring:
  application:
    name: customer-service
  datasource:
    # auth 와 다른 데이터베이스다. 서비스가 남의 테이블을 직접 읽기 시작하면 나눈 의미가 없어진다.
    url: ${DB_URL:jdbc:postgresql://localhost:55433/customer}
    username: ${DB_USERNAME:customer}
    password: ${DB_PASSWORD:customer}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway(db/migration)가 만든다. 엔티티와 어긋나면 뜨지 않는다.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:8081}

auth:
  client:
    # 이 서비스가 auth 에 대해 아는 전부다. 토큰을 물어보러 가는 주소가 아니라,
    # 검증에 쓸 공개키를 받아오는 주소다.
    #
    # JWKS 는 realm 마다 다른 주소로 나온다. 여기에는 포털 것만 적으므로 이 서비스는 어드민 realm 의
    # 공개키를 아예 갖지 못하고, 어드민 토큰은 서명 검증에서 죽는다 — 코드가 한 줄도 돌기 전에.
    # 직원용 API 가 필요해지면 이 서비스를 어드민 설정으로 한 벌 더 띄운다.
    realm: ${AUTH_REALM:PORTAL}
    jwks-uri: ${AUTH_JWKS_URI:http://localhost:8080/realms/portal/.well-known/jwks.json}
    # 모르는 kid 를 만나면 이 값과 무관하게 다시 받아온다(키 교체는 그 경로가 처리한다).
    cache-ttl: 10m
    # 시작할 때 미리 받지 않는다 — auth 보다 먼저 떠도 부팅이 실패하면 안 된다.
    warm-up: false

logging:
  level:
    com.brunosong.identityplatform: INFO
