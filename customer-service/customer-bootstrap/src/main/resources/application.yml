# customer-service 기본 설정.
spring:
  application:
    name: customer-service
  datasource:
    # auth 와 다른 데이터베이스다. 서비스가 남의 테이블을 직접 읽기 시작하면 나눈 의미가 없어진다.
    url: ${DB_URL:jdbc:postgresql://localhost:55433/customer}
    username: ${DB_USERNAME:customer}
    password: ${DB_PASSWORD:customer}
  security:
    oauth2:
      resourceserver:
        jwt:
          # 이 서비스가 auth 에 대해 아는 전부다. 발급자 이름에 realm 이 들어 있고,
          # Spring Security 가 여기서 discovery 문서를 받아 공개키 주소(jwks_uri)를 찾는다.
          #
          # 그래서 이 서비스는 포털 공개키만 갖는다 — 어드민 토큰은 서명 단계에서 죽는다.
          # 토큰의 iss 도 이 값과 대조하므로, 서명이 맞아도 다른 배포(staging 등)가 만든
          # 토큰이면 거부한다.
          #
          # 부팅할 때 auth 를 부르지 않는다. 디코더 생성이 첫 검증까지 미뤄지므로
          # (SupplierJwtDecoder) auth 보다 먼저 떠도 된다.
          #
          # 직원용 API 가 필요해지면 이 서비스를 어드민 발급자로 한 벌 더 띄운다.
          issuer-uri: ${AUTH_ISSUER:http://localhost:8080/realms/portal}

          # 이 서비스가 속한 시스템으로 발급된 토큰만 받아들인다(aud 검증).
          #
          # 발급자만 확인하면 그 realm 의 토큰이면 무엇이든 통한다. 다른 시스템으로 들어온
          # 토큰을 여기에 그대로 재생할 수 있다는 뜻이고, 늘수록 가장 약한 하나가 realm
          # 전체의 보안 수준이 된다.
          #
          # 값이 서비스 이름(customer-service)이 아니라 시스템 이름(shop)이다. 그래서
          # shop 시스템에 서비스가 몇 개 늘어도 이 줄은 바뀌지 않고, 이미 발급된 토큰도
          # 그대로 통한다. 그 안에서 서비스를 가르는 것은 아래 app.service-id 다.
          #
          # 로그인 경로의 realm(/realms/portal)과는 다른 값이다. realm 은 어느 서랍에서
          # 계정을 찾을지이고, 이것은 그 토큰을 누가 받아주는지다.
          #
          # Boot 3.4 가 더한 프로퍼티다. 3.3 에서는 이것을 위해 JwtDecoder 를 직접 만들어
          # 기본 검증기를 감싸야 했다(AudiencePolicy). 그 클래스를 지우고 이 두 줄로 바꿨다.
          audiences: ${AUTH_AUDIENCE:shop}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway(db/migration)가 만든다. 엔티티와 어긋나면 뜨지 않는다.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  # 토큰의 resource_access 에서 읽을 칸 이름. auth 의 authz_service.service_id 와 같아야 한다.
  #
  # aud(시스템)와 다른 값이다. aud 는 "이 토큰이 어느 시스템을 향하나" 이고, 이 값은
  # "그 시스템 안에서 나는 어느 서비스인가" 다. 전에는 둘이 같아서 aud 하나로 썼다.
  service-id: ${APP_SERVICE_ID:customer-service}

server:
  port: ${SERVER_PORT:8081}

logging:
  level:
    com.brunosong.identityplatform: INFO
