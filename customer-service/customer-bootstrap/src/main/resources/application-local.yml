# 로컬 개발 프로파일.
spring:
  jpa:
    show-sql: true
  flyway:
    clean-disabled: false

# 프론트엔드가 auth 와 이 서비스를 둘 다 부른다. 두 서비스가 각각 자기 CORS 를 밝혀야 하고,
# 한쪽만 열어두면 다른 쪽 호출이 브라우저에서 막힌다 — 게이트웨이가 없을 때의 대가다.
app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174

logging:
  level:
    com.brunosong.identityplatform: DEBUG
