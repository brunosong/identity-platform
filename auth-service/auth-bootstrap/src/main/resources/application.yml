# auth-service 기본 설정. 환경별 값은 프로파일이나 환경변수로 덮는다.
spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/identity}
    username: ${DB_USERNAME:identity}
    password: ${DB_PASSWORD:identity}
  jpa:
    open-in-view: false          # 뷰 렌더링 중 지연로딩을 막는다. API 전용 서비스라 쓸 일이 없다.
    hibernate:
      # 스키마는 Flyway(db/migration)가 만든다. 앱은 엔티티와 맞는지 확인만 하고, 어긋나면 뜨지 않는다.
      # 엔티티를 고치고 마이그레이션을 잊으면 배포가 조용히 지나가는 대신 부팅에서 걸린다.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:8080}

# 이 서비스가 자기 관리 API 에서 요구하는 대상(aud). auth 도 자기 API 에 대해서는
# 리소스 서버라, 자기 시스템으로 발급된 토큰만 받아야 한다.
#
# aud 는 시스템이므로 auth-service 가 아니라 backoffice 다. token.realms.ADMIN.system 과 짝이다.
# auth 자신이 그 시스템의 서비스 하나이고, 서비스 이름(auth-service)은 권한 조회에만 쓴다.
auth:
  audience: ${AUTH_AUDIENCE:backoffice}
  # resource_access 에서 auth 자신의 칸 이름. authz_service.service_id 와 같아야 한다.
  service-id: ${AUTH_SERVICE_ID:auth-service}

authorization:
  # RBAC 편집·캐시 리로드 같은 운영 API 를 부르는 데 필요한 권한 코드.
  manage-permission: AUTHZ_MANAGE
  access-control:
    # reload 는 그 호출을 받은 인스턴스만 갱신한다. TTL 이 나머지 인스턴스의 지연 창을 유한하게 만든다.
    cache-ttl-seconds: 60
    # 어떤 경로가 보호 대상인지 — ADMIN realm 은 여기 걸린 경로를 화이트리스트로 막는다.
    protected-path-prefixes: /page/,/api/
  single-session:
    # "한 곳에서 한 명". 켜면 토큰에 sid 가 실리고 재발급 때 현재성을 대조한다.
    enabled: false

token:
  # 토큰의 iss 가 되는 기준 주소. realm 이 뒤에 붙는다 — .../realms/portal
  # 소비 서비스는 이 문자열을 그대로 대조하므로, 포트를 옮기면 이 값도 함께 옮겨야 한다.
  issuer: ${TOKEN_ISSUER:http://localhost:8080}
  # access 를 1분으로 둔다. 실습용이라 짧다. 화면을 열어둔 채로 만료를 만나고, 앱이 401 을
  # 받아 재발급을 부르고, 원래 요청을 다시 보내는 흐름을 기다리지 않고 볼 수 있다.
  # 운영이라면 분 단위는 짧다. 재발급 왕복이 그만큼 잦아진다.
  accessExpiration: 60000        # 1분
  refreshExpiration: 86400000    # 24시간
  # realm 마다 다른 키페어를 쓴다. kid 는 realm 전체에서 유일해야 한다 —
  # 겹치면 상대 realm 키로 검증이 통과한다(부팅에서 막는다).
  # 키는 base64(DER): private=PKCS#8, public=X.509 SubjectPublicKeyInfo.
  realms:
    ADMIN:
      kid: ${ADMIN_KID:admin-1}
      privateKey: ${ADMIN_PRIVATE_KEY:}
      publicKey: ${ADMIN_PUBLIC_KEY:}
      # 이 realm 의 토큰이 향하는 시스템. 토큰의 aud 가 된다.
      #
      # 시스템은 마이크로서비스의 집합이다. 그 안에 서비스가 몇 개인지는 토큰도 앱도 모르고
      # DB(authz_service)만 안다. 그래서 서비스를 붙여도 이 값은 바뀌지 않는다.
      #
      # 적는 것은 시스템이지 서비스가 아니다. 서비스 목록은 DB 가 쥔다.
      system: backoffice
    PORTAL:
      kid: ${PORTAL_KID:portal-1}
      privateKey: ${PORTAL_PRIVATE_KEY:}
      publicKey: ${PORTAL_PUBLIC_KEY:}
      system: shop

# 소셜 로그인 제공자.
#
# 값이 비어 있으면 소셜 로그인이 꺼진 채로 뜬다. 기본값을 비워둔 것은 설정을 잊었을 때
# "로그인이 안 된다" 가 되는 편이 낫기 때문이다. 아무 값이나 들고 구글에 붙는 것보다는.
#
# client-secret 은 저장소에 들어가지 않는다. 같은 프로파일에 RSA 개발키가 그대로 적혀 있지만
# 그건 로컬용으로 만들어 버리는 값이고, 이것은 구글이 우리 앱에 발급한 진짜 비밀이다.
#
# 돌아올 주소(redirect_uri)는 여기 적지 않는다. token.issuer 뒤에 경로를 붙여 만든다.
# 주소가 두 군데 적혀 있으면 포트를 옮길 때 한쪽만 고치게 되고, 그 어긋남은 구글이
# redirect_uri_mismatch 를 뱉을 때까지 보이지 않는다.
social:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    # 앱이 구글 콜백을 직접 받는 방식을 쓸 때의 주소. 비우면 그 방식이 꺼진다.
    app-redirect-uri: ${GOOGLE_APP_REDIRECT_URI:}

logging:
  level:
    com.brunosong.identityplatform: INFO
