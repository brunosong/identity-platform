<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  운영 화면 맨 위의 메뉴. 화면마다 붙인다.
  active 는 지금 화면의 이름이다(clients, roles, permissions, employees).
-->
<div th:fragment="menu(active)">
    <style>
        nav.console { display: flex; align-items: center; gap: 16px; padding-bottom: 12px; margin-bottom: 24px; border-bottom: 1px solid #ddd; }
        nav.console a { color: #555; text-decoration: none; }
        nav.console a.on { color: #1b1b1b; font-weight: 700; }
        nav.console form.logout { margin: 0 0 0 auto; padding: 0; border: 0; }
        nav.console form.logout button { margin: 0; padding: 4px 12px; background: #fff; color: #333; border: 1px solid #333; font: inherit; cursor: pointer; }
    </style>
    <nav class="console">
        <a th:href="@{/page/oauth-clients}" th:classappend="${active == 'clients'} ? 'on' : ''">등록된 앱</a>
        <a th:href="@{/page/roles}" th:classappend="${active == 'roles'} ? 'on' : ''">역할</a>
        <a th:href="@{/page/permissions}" th:classappend="${active == 'permissions'} ? 'on' : ''">권한</a>
        <a th:href="@{/page/employees/new}" th:classappend="${active == 'employees'} ? 'on' : ''">직원 등록</a>
        <form class="logout" method="post" th:action="@{/page/logout}">
            <button type="submit">로그아웃</button>
        </form>
    </nav>
</div>

</body>
</html>
