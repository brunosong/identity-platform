<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>사람의 역할</title>
    <style>
        body { font: 14px/1.6 system-ui, sans-serif; color: #1b1b1b; max-width: 860px; margin: 40px auto; padding: 0 20px; }
        h1 { font-size: 20px; margin-bottom: 4px; }
        h2 { font-size: 16px; margin: 28px 0 4px; }
        p.lead { color: #555; margin-top: 0; }
        nav.realms a { margin-right: 12px; }
        nav.realms a.on { font-weight: 700; color: #1b1b1b; text-decoration: none; }
        form.find { border: 1px solid #ddd; padding: 16px 20px; margin: 24px 0; }
        form.find label { display: block; font-weight: 600; }
        input[type=text] { width: 100%; padding: 6px 8px; border: 1px solid #bbb; font: inherit; box-sizing: border-box; }
        button { margin-top: 16px; padding: 7px 18px; font: inherit; border: 1px solid #333; background: #333; color: #fff; cursor: pointer; }
        dl { display: grid; grid-template-columns: 90px 1fr; gap: 2px 12px; margin: 8px 0 16px; }
        dt { color: #666; }
        dd { margin: 0; }
        .code { font-family: ui-monospace, monospace; font-size: 13px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e5e5e5; vertical-align: top; }
        th { background: #fafafa; font-size: 13px; }
        .off { color: #999; }
        .notice { padding: 10px 14px; border-left: 3px solid #333; background: #f6f6f6; }
        .notice.bad { border-color: #b00020; }
        .empty { color: #777; padding: 20px 0; }
    </style>
</head>
<body>

<div th:replace="~{console/fragments :: menu('subjects')}"></div>

<h1>사람의 역할</h1>
<p class="lead">
    사람을 찾아 역할을 붙이거나 뗀다. 역할은 토큰의 realm_access 에, 그 역할에 묶인 권한은
    resource_access 에 실린다. 이미 나간 토큰은 바뀌지 않고, 다음 발급이나 갱신부터 반영된다.
</p>

<nav class="realms">
    <a th:each="r : ${realms}" th:href="@{/page/subjects(realm=${r})}" th:text="${r}"
       th:classappend="${r == realm} ? 'on' : ''"></a>
</nav>

<form class="find" method="get" th:action="@{/page/subjects}">
    <input type="hidden" name="realm" th:value="${realm}">
    <label for="login">이메일 또는 로그인 아이디</label>
    <input type="text" id="login" name="login" th:value="${login}" required autocomplete="off">
    <button type="submit">찾기</button>
</form>

<div class="notice" th:if="${message}" th:text="${message}"></div>
<div class="notice bad" th:if="${notFound}"
     th:text="${realm} + ' 에 ' + ${login} + ' 인 사람이 없다. 소셜 계정만 있는 사람은 여기서 찾을 수 없다.'"></div>

<th:block th:if="${person}">
    <h2 th:text="${person.name} ?: '(이름 없음)'"></h2>
    <dl>
        <dt>이메일</dt>
        <dd th:text="${person.email} ?: '-'"></dd>
        <dt>subject</dt>
        <dd class="code" th:text="${person.subjectId}"></dd>
    </dl>

    <form method="post" th:action="@{/page/subjects/roles}" th:if="${!roles.isEmpty()}">
        <input type="hidden" name="realm" th:value="${realm}">
        <input type="hidden" name="subjectId" th:value="${person.subjectId}">
        <input type="hidden" name="login" th:value="${login}">

        <table>
            <thead>
            <tr>
                <th style="width: 6%"></th>
                <th style="width: 30%">코드</th>
                <th style="width: 34%">이름</th>
                <th>상태</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="role : ${roles}">
                <td>
                    <input type="checkbox" name="roleIds"
                           th:id="'r' + ${role.roleId}"
                           th:value="${role.roleId}"
                           th:checked="${assignedRoleIds.contains(role.roleId)}">
                </td>
                <td class="code"><label th:for="'r' + ${role.roleId}" th:text="${role.roleCode}"></label></td>
                <td th:text="${role.roleName}"></td>
                <td th:text="${role.active} ? '사용' : '중지'" th:classappend="${role.active} ? '' : 'off'"></td>
            </tr>
            </tbody>
        </table>

        <button type="submit">저장</button>
    </form>

    <p class="empty" th:if="${roles.isEmpty()}" th:text="${realm} + ' 에는 아직 역할이 없다.'"></p>
</th:block>

</body>
</html>
