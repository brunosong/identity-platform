<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>가입 완료</title>
    <style>
        body { font: 15px/1.6 system-ui, sans-serif; color: #1b1b1b; background: #f4f4f5; margin: 0; }
        .card { width: 340px; margin: 72px auto; background: #fff; border: 1px solid #e0e0e0; padding: 32px 28px; }
        h1 { font-size: 19px; margin: 0 0 12px; }
        p { margin: 0 0 10px; }
        .hint { color: #777; font-size: 13px; }
        .foot { margin-top: 20px; font-size: 13px; border-top: 1px solid #eee; padding-top: 14px; word-break: break-all; }
    </style>
</head>
<body>

<div class="card">
    <h1>가입을 완료했습니다</h1>
    <p><span th:text="${email}">메일 주소</span> 로 가입했습니다.</p>
    <p class="hint">로그인은 되지 않은 상태입니다. 앱으로 돌아가 로그인해 주세요.</p>

    <!--
      돌아갈 주소는 그 앱에 등록된 주소일 때만 보인다. 적혀 온 값을 그대로 링크로 걸면 이 화면이
      아무 사이트로나 보내는 발판이 된다. 자동으로 보내지 않고 사람이 누르게 둔다.
    -->
    <p class="foot" th:if="${returnUri}">
        돌아가기: <a th:href="${returnUri}" th:text="${returnUri}">주소</a>
    </p>
    <p class="foot hint" th:unless="${returnUri}">이 창을 닫아도 됩니다.</p>
</div>

</body>
</html>
