# 스키마는 엔티티에서 만든다(ddl-auto). 여기서 보는 것은 어댑터/매퍼/쿼리의 동작
# (신원 왕복, 역할-권한 조인, URL 규칙 조립)이다.
# TODO 마이그레이션 스크립트는 auth-service 가 직접 소유해야 한다(Flyway). 아직 없다.
spring:
  flyway:
    enabled: false
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
