# 영속성 테스트는 실제 마이그레이션 스키마 위에서 돈다.
#
# 전에는 엔티티에서 스키마를 만들었다(ddl-auto). 그러면 테스트가 통과해도 운영 스키마에서 도는지는
# 알 수 없다 — Hibernate 가 만들어주는 것과 마이그레이션이 만드는 것이 같다는 보장이 없기 때문이다.
# 특히 복합 외래키처럼 엔티티 매핑에서 생성되지 않는 제약은 이렇게 하지 않으면 아무도 확인하지 않는다.
#
# validate 는 덤이다: 마이그레이션과 엔티티가 어긋나면 테스트가 뜨지 않는다.
spring:
  flyway:
    enabled: true
    clean-disabled: false
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
